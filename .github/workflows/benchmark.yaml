name: Benchmark CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-run:
    name: Build & Run Benchmark

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y cmake clang-format-18 libc++-18 libc++-18-dev bash
          export PATH=$PATH:/usr/lib/llvm-18/bin

      - name: Make scripts executable
        run: |
          chmod +x ./scripts/check_build.sh
          chmod +x ./scripts/run_benchmark.sh

      - name: Prepare temp directory
        run: mkdir -p temp

      - name: Run Benchmark
        run: ./scripts/run_benchmark.sh