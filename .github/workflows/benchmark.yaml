name: Benchmark CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-run:
    name: Build & Run Benchmark

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake make

      - name: Make scripts executable
        run: |
          chmod +x ./scripts/check_build.sh
          chmod +x ./scripts/run_benchmark.sh

      - name: Run Benchmark
        run: ./scripts/run_benchmark.sh